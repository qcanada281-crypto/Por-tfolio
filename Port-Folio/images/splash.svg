<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 140" fill="none" preserveAspectRatio="none">
  <defs>
    <!-- Background Gradient Matching Theme -->
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#07090E" stop-opacity="1"/>
      <stop offset="50%" stop-color="#0A0E17" stop-opacity="1"/>
      <stop offset="100%" stop-color="#07090E" stop-opacity="1"/>
    </linearGradient>

    <!-- Neon Glow Gradient -->
    <linearGradient id="neonBeam2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#CFFF04" stop-opacity="0"/>
      <stop offset="25%" stop-color="#CFFF04" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#CFFF04" stop-opacity="1"/>
      <stop offset="75%" stop-color="#CFFF04" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#CFFF04" stop-opacity="0"/>
    </linearGradient>

    <!-- Secondary Gradient -->
    <linearGradient id="cyberBeam2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#CFFF04" stop-opacity="0"/>
      <stop offset="40%" stop-color="#CFFF04" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="60%" stop-color="#CFFF04" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#CFFF04" stop-opacity="0"/>
    </linearGradient>

    <filter id="glow2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="deepGlow2" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="16" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Base Seamless Dark Background -->
  <rect width="1920" height="140" fill="url(#bgGrad2)"/>

  <!-- Center Ambient Glow -->
  <ellipse cx="960" cy="70" rx="700" ry="45" fill="#CFFF04" fill-opacity="0.05" filter="url(#deepGlow2)"/>

  <!-- Grid Tech Lines -->
  <line x1="0" y1="35" x2="1920" y2="35" stroke="rgba(255,255,255,0.025)" stroke-width="1"/>
  <line x1="0" y1="70" x2="1920" y2="70" stroke="rgba(255,255,255,0.04)" stroke-width="1" stroke-dasharray="3,9"/>
  <line x1="0" y1="105" x2="1920" y2="105" stroke="rgba(255,255,255,0.025)" stroke-width="1"/>

  <!-- Cyber Nodes -->
  <g opacity="0.7">
    <circle cx="480" cy="70" r="3" fill="#CFFF04" opacity="0.4"/>
    <circle cx="960" cy="70" r="4.5" fill="#CFFF04" filter="url(#glow2)"/>
    <circle cx="960" cy="70" r="1.8" fill="#FFFFFF"/>
    <circle cx="1440" cy="70" r="3" fill="#CFFF04" opacity="0.4"/>
  </g>

  <!-- Geometric Wave Stream -->
  <path d="M0,70 Q480,110 960,70 T1920,70" stroke="url(#neonBeam2)" stroke-width="6" opacity="0.3" filter="url(#deepGlow2)"/>
  <path d="M0,70 Q480,30 960,70 T1920,70" stroke="url(#neonBeam2)" stroke-width="1.5" opacity="0.3" stroke-dasharray="8,10"/>
  <path d="M0,70 Q480,110 960,70 T1920,70" stroke="url(#cyberBeam2)" stroke-width="2.5" filter="url(#glow2)"/>

  <!-- Top and Bottom Borders -->
  <line x1="0" y1="0" x2="1920" y2="0" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <line x1="0" y1="140" x2="1920" y2="140" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
</svg>