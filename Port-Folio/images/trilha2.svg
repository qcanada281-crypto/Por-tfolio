<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 140" fill="none" preserveAspectRatio="none">
  <defs>
    <!-- Background Gradient Matching Theme -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#07090E" stop-opacity="1"/>
      <stop offset="50%" stop-color="#0A0E17" stop-opacity="1"/>
      <stop offset="100%" stop-color="#07090E" stop-opacity="1"/>
    </linearGradient>

    <!-- Neon Glow Gradient -->
    <linearGradient id="neonBeam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#CFFF04" stop-opacity="0"/>
      <stop offset="25%" stop-color="#CFFF04" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#CFFF04" stop-opacity="1"/>
      <stop offset="75%" stop-color="#CFFF04" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#CFFF04" stop-opacity="0"/>
    </linearGradient>

    <!-- Secondary Cyan/Neon Gradient -->
    <linearGradient id="cyberBeam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0"/>
      <stop offset="35%" stop-color="#CFFF04" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="65%" stop-color="#CFFF04" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="deepGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="16" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Base Seamless Dark Background -->
  <rect width="1920" height="140" fill="url(#bgGrad)"/>

  <!-- Subtle Ambient Radial Glow in Center -->
  <ellipse cx="960" cy="70" rx="600" ry="50" fill="#CFFF04" fill-opacity="0.04" filter="url(#deepGlow)"/>

  <!-- Horizontal Grid Guides -->
  <line x1="0" y1="20" x2="1920" y2="20" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
  <line x1="0" y1="70" x2="1920" y2="70" stroke="rgba(255,255,255,0.04)" stroke-width="1" stroke-dasharray="4,8"/>
  <line x1="0" y1="120" x2="1920" y2="120" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>

  <!-- Cyber Tech Nodes & Telemetry -->
  <g opacity="0.6">
    <circle cx="360" cy="70" r="3" fill="#CFFF04" opacity="0.4"/>
    <circle cx="960" cy="70" r="5" fill="#CFFF04" filter="url(#glow)"/>
    <circle cx="960" cy="70" r="2" fill="#FFFFFF"/>
    <circle cx="1560" cy="70" r="3" fill="#CFFF04" opacity="0.4"/>
    
    <!-- Crosshairs -->
    <path d="M940,70 L980,70 M960,50 L960,90" stroke="#CFFF04" stroke-width="1" opacity="0.3"/>
    <path d="M350,70 L370,70 M360,60 L360,80" stroke="#CFFF04" stroke-width="0.75" opacity="0.2"/>
    <path d="M1550,70 L1570,70 M1560,60 L1560,80" stroke="#CFFF04" stroke-width="0.75" opacity="0.2"/>
  </g>

  <!-- Deep Glow Layer of Main Curve -->
  <path d="M0,70 Q480,20 960,70 T1920,70" stroke="url(#neonBeam)" stroke-width="8" opacity="0.35" filter="url(#deepGlow)"/>

  <!-- Secondary Counter Wave Curve -->
  <path d="M0,70 Q480,120 960,70 T1920,70" stroke="url(#neonBeam)" stroke-width="1.5" opacity="0.25" stroke-dasharray="6,12"/>

  <!-- Core Sharp Laser Beam Stream -->
  <path d="M0,70 Q480,20 960,70 T1920,70" stroke="url(#cyberBeam)" stroke-width="2.5" filter="url(#glow)"/>

  <!-- Center Laser Core -->
  <line x1="600" y1="70" x2="1320" y2="70" stroke="url(#neonBeam)" stroke-width="1.5" opacity="0.7"/>

  <!-- Top and Bottom Seamless Fade Dividers -->
  <line x1="0" y1="0" x2="1920" y2="0" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <line x1="0" y1="140" x2="1920" y2="140" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
</svg>
